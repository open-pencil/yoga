name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org/

      - name: Install root dependencies
        run: npm install

      - name: Install JS dependencies
        working-directory: javascript
        run: npm install

      - name: Build & test
        working-directory: javascript
        run: |
          npx just build
          npx just test

      - name: Prepack
        working-directory: javascript
        run: npx just prepack

      - name: Set package identity
        working-directory: javascript
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.name = '@open-pencil/yoga-layout';
            pkg.version = '${VERSION}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "Publishing @open-pencil/yoga-layout@${VERSION}"

      - name: Publish to npm
        working-directory: javascript
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TAG="latest"
          if echo "$VERSION" | grep -q "-"; then
            TAG="grid"
          fi
          npm publish --access public --provenance --ignore-scripts --tag "$TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
